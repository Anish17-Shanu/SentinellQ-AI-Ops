[project]
name = "sentineliq-ai-ops"
version = "0.1.1"
description = "Explainable, deterministic incident scoring and on-call response API"
authors = [{ name = "Anish Kumar" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "coverage"]
postgres = ["psycopg[binary]"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
exclude = ["tests/", "api/", "scripts/"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/asgi.py", "src/sentry.py", "src/postgres_repository.py"]

[tool.coverage.report]
fail_under = 70
skip_covered = true
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
